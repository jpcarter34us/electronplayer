<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- ElectronPlayer app icon: headphones around a music note. Rendered to
       icon.png / icon.icns by scripts/make-icon.cjs. The tile follows the
       macOS grid: 824 px on a 1024 canvas, with room for the shadow. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B2BBF"/>
      <stop offset="0.55" stop-color="#7B2FD0"/>
      <stop offset="1" stop-color="#E2468F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4DDF7"/>
    </linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#FFB547"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1A0B4D" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>

  <g filter="url(#soft)">
    <!-- Headband -->
    <path d="M292 600 V530 A220 220 0 0 1 732 530 V600" fill="none" stroke="#FFFFFF" stroke-width="54" stroke-linecap="round"/>
    <!-- Ear cups -->
    <rect x="236" y="540" width="136" height="232" rx="62" fill="url(#cup)"/>
    <rect x="652" y="540" width="136" height="232" rx="62" fill="url(#cup)"/>
    <rect x="318" y="576" width="34" height="160" rx="17" fill="#2A1A73" opacity="0.45"/>
    <rect x="672" y="576" width="34" height="160" rx="17" fill="#2A1A73" opacity="0.45"/>

    <!-- Beamed eighth notes -->
    <g fill="url(#note)">
      <ellipse cx="460" cy="706" rx="50" ry="38" transform="rotate(-22 460 706)"/>
      <ellipse cx="584" cy="676" rx="50" ry="38" transform="rotate(-22 584 676)"/>
      <rect x="484" y="470" width="22" height="236"/>
      <rect x="608" y="440" width="22" height="236"/>
      <path d="M484 470 L630 440 L630 498 L484 528 Z"/>
    </g>
  </g>
</svg>
