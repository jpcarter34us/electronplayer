<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src file: 'self'; style-src 'self'">
  <title>Audacious</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="toolbar">
    <button id="open" title="Open files">⏏</button>
    <button id="prev" title="Previous">⏮</button>
    <button id="play" title="Play / Pause">▶</button>
    <button id="stop" title="Stop">⏹</button>
    <button id="next" title="Next">⏭</button>
    <input id="seek" type="range" min="0" max="0" value="0" aria-label="Seek">
    <span id="time">--:-- / --:--</span>
    <input id="volume" type="range" min="0" max="100" value="100" aria-label="Volume">
  </header>
  <section class="infobar"><h1 id="title">Audacious</h1></section>
  <section id="vis" class="visbar" hidden></section>
  <main><ol id="playlist"></ol></main>
  <footer class="statusbar">
    <span id="count">0 songs</span>
    <span id="status">Drop files here or click ⏏ · right-click a song to remove it</span>
    <button id="clear">Clear</button>
    <span id="backend"></span>
  </footer>
  <script type="module" src="app.js"></script>
</body>
</html>
